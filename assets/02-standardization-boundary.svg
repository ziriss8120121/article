<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="750" viewBox="0 115 1500 750" role="img" aria-labelledby="title desc">
  <title id="title">共通化した枠組みと案件ごとに決める内容</title>
  <desc id="desc">評価区分と完了条件、完了条件から評価観点、評価基準、合格基準へ進む流れを共通化し、対象判定や具体的内容は案件ごとに決めることを示す。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Yu Gothic", sans-serif; }
      .band-label { font-size: 18px; font-weight: 800; }
      .step { font-size: 14px; font-weight: 800; letter-spacing: .06em; fill: #64748b; }
      .stage { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .stage-note { font-size: 15px; fill: #475569; }
      .badge { font-size: 13px; font-weight: 800; }
      .decision { font-size: 17px; font-weight: 800; fill: #7c2d12; }
      .decision-note { font-size: 15px; fill: #475569; }
      .example-label { font-size: 13px; font-weight: 800; fill: #9a3412; }
      .example { font-size: 15px; font-weight: 600; fill: #334155; }
    </style>
  </defs>

  <rect width="1500" height="950" rx="28" fill="#f8fafc"/>

  <g class="base">
    <!-- Common layer -->
    <rect x="55" y="130" width="1390" height="306" rx="24" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="80" y="154" width="208" height="34" rx="17" fill="#4f46e5"/>
    <text class="band-label" x="184" y="178" text-anchor="middle" fill="#ffffff">全案件で共通化</text>
    <text class="stage-note" x="316" y="177">評価の出発点と、具体化していく順番・フォーマット</text>

    <line x1="370" y1="294" x2="426" y2="294" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="710" y1="294" x2="766" y2="294" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1050" y1="294" x2="1106" y2="294" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="80" y="216" width="290" height="158" rx="18" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <text class="step" x="104" y="247">START</text>
    <text class="stage" x="104" y="281">評価区分 ＋ 完了条件</text>
    <text class="stage-note" x="104" y="315">区分の階層と「目指す状態」を</text>
    <text class="stage-note" x="104" y="338">共通カタログとして用意</text>
    <rect x="104" y="350" width="128" height="25" rx="12" fill="#e0e7ff"/>
    <text class="badge" x="168" y="368" text-anchor="middle" fill="#4338ca">内容まで共通</text>

    <rect x="420" y="216" width="290" height="158" rx="18" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <text class="step" x="444" y="247">STEP 1</text>
    <text class="stage" x="444" y="281">評価観点</text>
    <text class="stage-note" x="444" y="315">完了条件を案件固有の</text>
    <text class="stage-note" x="444" y="338">「何を見るか」へ具体化</text>
    <rect x="444" y="350" width="184" height="25" rx="12" fill="#f1f5f9"/>
    <text class="badge" x="536" y="368" text-anchor="middle" fill="#475569">順序・フォーマットを共通</text>

    <rect x="760" y="216" width="290" height="158" rx="18" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <text class="step" x="784" y="247">STEP 2</text>
    <text class="stage" x="784" y="281">5段階の評価基準</text>
    <text class="stage-note" x="784" y="315">評価する人が同じ基準で</text>
    <text class="stage-note" x="784" y="338">判断できる条件を定義</text>
    <rect x="784" y="350" width="184" height="25" rx="12" fill="#f1f5f9"/>
    <text class="badge" x="876" y="368" text-anchor="middle" fill="#475569">順序・フォーマットを共通</text>

    <rect x="1100" y="216" width="290" height="158" rx="18" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <text class="step" x="1124" y="247">STEP 3</text>
    <text class="stage" x="1124" y="281">合格基準</text>
    <text class="stage-note" x="1124" y="315">平均点・重大NGなどの</text>
    <text class="stage-note" x="1124" y="338">合格条件を定義</text>
    <rect x="1124" y="350" width="184" height="25" rx="12" fill="#f1f5f9"/>
    <text class="badge" x="1216" y="368" text-anchor="middle" fill="#475569">順序・フォーマットを共通</text>

    <!-- Down arrows -->
    <line x1="225" y1="374" x2="225" y2="536" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <line x1="565" y1="374" x2="565" y2="536" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <line x1="905" y1="374" x2="905" y2="536" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <line x1="1245" y1="374" x2="1245" y2="536" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>

    <!-- Project-specific layer -->
    <rect x="55" y="470" width="1390" height="380" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <rect x="80" y="494" width="228" height="34" rx="17" fill="#ea580c"/>
    <text class="band-label" x="194" y="518" text-anchor="middle" fill="#ffffff">案件ごとに判断する</text>
    <text class="stage-note" x="336" y="517">機能の目的・入力・ユーザー・利用方法に合わせて中身を決める</text>

    <rect x="80" y="550" width="290" height="240" rx="18" fill="#ffffff" stroke="#fdba74"/>
    <text class="decision" x="104" y="586">対象／対象外と判断理由</text>
    <text class="decision-note" x="104" y="617">各完了条件を評価に使うか判断</text>
    <line x1="104" y1="640" x2="346" y2="640" stroke="#fed7aa"/>
    <text class="example-label" x="104" y="668">例</text>
    <text class="example" x="104" y="696">誤情報・誤誘導：対象</text>
    <text class="example" x="104" y="722">求人条件の誤りが候補者の</text>
    <text class="example" x="104" y="746">判断へ影響するため</text>

    <rect x="420" y="550" width="290" height="240" rx="18" fill="#ffffff" stroke="#fdba74"/>
    <text class="decision" x="444" y="586">評価観点の内容</text>
    <text class="decision-note" x="444" y="617">案件で実際に確認する切り口</text>
    <line x1="444" y1="640" x2="686" y2="640" stroke="#fed7aa"/>
    <text class="example-label" x="444" y="668">例</text>
    <text class="example" x="444" y="696">未記載情報の生成</text>
    <text class="example" x="444" y="722">求人票にない条件を事実として</text>
    <text class="example" x="444" y="746">生成していないか</text>

    <rect x="760" y="550" width="290" height="240" rx="18" fill="#ffffff" stroke="#fdba74"/>
    <text class="decision" x="784" y="586">評価基準の内容</text>
    <text class="decision-note" x="784" y="617">5〜1点それぞれの判定条件</text>
    <line x1="784" y1="640" x2="1026" y2="640" stroke="#fed7aa"/>
    <text class="example-label" x="784" y="668">例</text>
    <text class="example" x="784" y="690">5：情報の追加なし</text>
    <text class="example" x="784" y="710">4：言い換えのみ</text>
    <text class="example" x="784" y="730">3：推測だと明確で誤認なし</text>
    <text class="example" x="784" y="750">2：一部を事実として追加</text>
    <text class="example" x="784" y="770">1：重要条件を事実として追加</text>

    <rect x="1100" y="550" width="290" height="240" rx="18" fill="#ffffff" stroke="#fdba74"/>
    <text class="decision" x="1124" y="586">合格基準の内容</text>
    <text class="decision-note" x="1124" y="617">平均点や重大NGの扱い</text>
    <line x1="1124" y1="640" x2="1366" y2="640" stroke="#fed7aa"/>
    <text class="example-label" x="1124" y="668">例</text>
    <text class="example" x="1124" y="696">評価対象：10件</text>
    <text class="example" x="1124" y="722">平均点3.0以上</text>
    <text class="example" x="1124" y="748">かつ評価1が0件</text>

  </g>
</svg>
