<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">評価区分ごとに完了条件を定義する</title>
  <desc id="desc">評価区分「誤情報・誤誘導」に対して、評価を通して目指す状態を完了条件として定義する例。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Yu Gothic", sans-serif; }
      .band-label { font-size: 18px; font-weight: 800; }
      .eyebrow { font-size: 15px; font-weight: 800; letter-spacing: .06em; }
      .category { font-size: 29px; font-weight: 800; fill: #0f172a; }
      .condition { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .note { font-size: 16px; fill: #475569; }
      .arrow-label { font-size: 17px; font-weight: 800; fill: #475569; }
    </style>
  </defs>

  <rect width="1500" height="520" rx="28" fill="#f8fafc"/>

  <g class="base">
    <rect x="55" y="42" width="1390" height="424" rx="24" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="80" y="66" width="208" height="34" rx="17" fill="#4f46e5"/>
    <text class="band-label" x="184" y="90" text-anchor="middle" fill="#ffffff">全案件で共通</text>
    <text class="note" x="316" y="89">各評価区分について、評価を通して目指す状態を定義</text>

    <rect x="105" y="150" width="430" height="236" rx="22" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="137" y="180" width="112" height="30" rx="15" fill="#e0e7ff"/>
    <text class="eyebrow" x="193" y="201" text-anchor="middle" fill="#4338ca">評価区分</text>
    <text class="category" x="137" y="270">誤情報・誤誘導</text>
    <line x1="137" y1="300" x2="503" y2="300" stroke="#e2e8f0" stroke-width="2"/>
    <text class="note" x="137" y="336">LLM出力の何を評価するか</text>

    <line x1="565" y1="268" x2="715" y2="268" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text class="arrow-label" x="640" y="240" text-anchor="middle">目指す状態を定義</text>

    <rect x="745" y="130" width="650" height="276" rx="22" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <rect x="777" y="160" width="112" height="30" rx="15" fill="#4f46e5"/>
    <text class="eyebrow" x="833" y="181" text-anchor="middle" fill="#ffffff">完了条件</text>
    <text class="condition" x="777" y="239">入力や参照情報と整合し、</text>
    <text class="condition" x="777" y="282">虚偽・誤りやユーザーの誤認につながる</text>
    <text class="condition" x="777" y="325">内容を含まない状態</text>
    <line x1="777" y1="350" x2="1363" y2="350" stroke="#e2e8f0" stroke-width="2"/>
    <text class="note" x="777" y="380">評価を通して、どのような状態を目指すのか</text>
  </g>
</svg>
